<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SiSampah</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header-section" style="background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));">
            <h1><i class="fas fa-user-check"></i> Panel Admin</h1>
            <p>Kelola dan pantau status laporan masyarakat.</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Pelapor</th>
                        <th>Lokasi</th>
                        <th>Foto</th>
                        <th>Status</th>
                        <th>Tanggal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in laporan %}
                    <tr>
                        <td style="font-weight: 600; color: #999;">#{{ row[0] }}</td>
                        <td style="font-weight: 500;">{{ row[1] }}</td>
                        <td><small>{{ row[2] }}</small></td>
                        <td><img src="{{ row[4] }}" class="img-thumbnail" alt="foto"></td>
                        <td>
                            <span class="badge status-{{ row[5] }}">
                                {{ row[5] }}
                            </span>
                        </td>
                        <td>{{ row[6].strftime('%d/%m/%y') }}</td>
                        <td>
                            <form method="POST" action="/update/{{ row[0] }}" style="display: flex; gap: 5px; justify-content: center;">
                                <select name="status" style="width: auto; padding: 5px; font-size: 0.8rem;">
                                    <option value="baru" {% if row[5] == 'baru' %}selected{% endif %}>Baru</option>
                                    <option value="proses" {% if row[5] == 'proses' %}selected{% endif %}>Proses</option>
                                    <option value="selesai" {% if row[5] == 'selesai' %}selected{% endif %}>Selesai</option>
                                </select>
                                <button type="submit" class="btn btn-update">Update</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="/" class="btn" style="background: #eee; color: #666;"><i class="fas fa-home"></i> Beranda</a>
        </div>
    </div>
</body>
</html>
