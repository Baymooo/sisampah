<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buat Laporan - SiSampah</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .header { background: #2ecc71; color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        label { font-weight: bold; }
        .btn { background: #2ecc71; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        a { color: #2ecc71; }
    </style>
</head>
<body>
    <div class="header"><h1>📝 Buat Laporan Sampah</h1></div>
    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <label>Nama Pelapor:</label>
            <input type="text" name="nama" required placeholder="Nama lengkap kamu">

            <label>Lokasi Sampah:</label>
            <input type="text" name="lokasi" required placeholder="Contoh: Jl. Merdeka No. 5, Bandung">

            <label>Deskripsi:</label>
            <textarea name="deskripsi" rows="4" required placeholder="Jelaskan kondisi sampah..."></textarea>

            <label>Foto Bukti:</label>
            <input type="file" name="foto" accept="image/*" required>

            <br><br>
            <button type="submit" class="btn">🚀 Kirim Laporan</button>
        </form>
        <br><a href="/">← Kembali</a>
    </div>
</body>
</html>
