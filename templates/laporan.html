<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - SiSampah</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container" style="max-width: 700px;">
        <div class="header-section" style="padding: 40px 20px;">
            <h1><i class="fas fa-bullhorn"></i> Buat Laporan</h1>
            <p>Isi data di bawah dengan lengkap dan sertakan foto bukti.</p>
        </div>

        <div class="card">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nama Pelapor</label>
                    <input type="text" name="nama" required placeholder="Masukkan nama lengkap Anda">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Lokasi Sampah</label>
                    <input type="text" name="lokasi" required placeholder="Contoh: Jl. Merdeka No. 5, Bandung">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-align-left"></i> Deskripsi Kondisi</label>
                    <textarea name="deskripsi" rows="4" required placeholder="Ceritakan detail kondisi sampah di lokasi tersebut..."></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-camera"></i> Foto Bukti</label>
                    <input type="file" name="foto" accept="image/*" required style="border: none; padding: 10px 0;">
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">
                    <a href="/" style="color: #999; text-decoration: none;"><i class="fas fa-arrow-left"></i> Kembali</a>
                    <button type="submit" class="btn btn-main">
                        <i class="fas fa-paper-plane"></i> Kirim Laporan
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
