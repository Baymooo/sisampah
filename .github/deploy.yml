name: Deploy SiSampah ke EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode dari GitHub
      uses: actions/checkout@v3

    - name: Login ke Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/sisampah:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/sisampah:latest

    - name: Deploy ke EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/sisampah:latest
          docker stop sisampah || true
          docker rm sisampah || true
          docker run -d \
            --name sisampah \
            -p 80:5000 \
            -e AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            -e AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
            -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_NAME=sisampah \
            -e DB_USER=adminbaik \
            -e DB_PASS=${{ secrets.DB_PASS }} \
            ${{ secrets.DOCKER_USERNAME }}/sisampah:latest